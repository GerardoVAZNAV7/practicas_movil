# Memoria para el daemon de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Usar AndroidX (obligatorio en proyectos modernos)
android.useAndroidX=true

# Estilo de código Kotlin recomendado para el proyecto
kotlin.code.style=official

# Evita que cada clase R contenga todos los recursos de las dependencias
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
